[package]
name = "manager"
version = "0.1.0"
edition = "2024"
description = "Idempotent installer for a Claude Code launcher app (macOS / Linux / Windows)"

[[bin]]
name = "install"
path = "src/main.rs"

[dependencies]
dirs = "5"
serde_json = "1"

[lints.clippy]
# Flatten nested `if` statements that can be combined with `&&`. Deeply nested
# conditionals add indentation and obscure the single combined condition that is
# actually being checked; collapsing them keeps control flow flat and readable.
collapsible_if = "deny"
# Flag functions that take an argument by value (consuming/moving it) when the
# body only needs it by reference. Borrowing instead avoids needless moves/clones
# and makes the signature document intent: `&T` means "only read", by-value means
# "takes ownership". Keeps call sites from surrendering ownership they could keep.
needless_pass_by_value = "deny"

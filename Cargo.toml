[package]
name = "manager"
version = "0.1.0"
edition = "2024"
description = "Idempotent installer for a Claude Code launcher app (macOS / Linux / Windows)"

[[bin]]
name = "install"
path = "src/main.rs"

[dependencies]
dirs = "5"
serde_json = "1"

[lints.clippy]
# Require a `# Panics` documentation section on public, documented functions that
# may panic. Callers reading the docs should know up front which inputs or states
# can abort the program, instead of discovering it from a runtime crash. This
# keeps the panic contract of the public API explicit and accurate.
missing_panics_doc = "deny"
# Flatten nested `if` statements that can be combined with `&&`. Deeply nested
# conditionals add indentation and obscure the single combined condition that is
# actually being checked; collapsing them keeps control flow flat and readable.
collapsible_if = "deny"
# Flag `.expect()` on `Result`/`Option`. This installer performs many filesystem
# operations (create dirs, chmod, read/write config) whose failures should be
# reported with context and propagated, not turned into a panic + backtrace that
# leaves the install half-applied. Set to "warn" (not "deny") so the existing
# call sites surface as tracked tech debt without breaking the build; new code
# should prefer `?`-based error propagation over `expect`.
expect_used = "warn"
# Flag `.unwrap()` on `Result`/`Option`, the sibling footgun to `expect()`: it
# panics on `Err`/`None` with no context at all, aborting a partially-applied
# install instead of propagating a recoverable error. The codebase currently has
# zero `unwrap()` call sites, so this is set to "deny" (stronger than the `warn`
# used for `expect_used`, which has grandfathered call sites) to lock in that
# clean state and force new code onto `?`-based error propagation.
unwrap_used = "deny"
# Prefer `let ... else { diverge }` over a verbose `match`/`if let ... else`
# whose only job is to bind the happy path and otherwise return/break/continue.
# The dedicated construct states "bind or diverge" in one line, keeps the bound
# value at the outer scope without extra nesting, and flattens control flow. No
# current violations exist, so `deny` keeps the build green while preventing
# future regressions.
manual_let_else = "deny"
